<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong | Online Bookstore</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="error-page">
    <p class="error-code" th:text="${status}">500</p>
    <h1 th:text="${status == 404} ? 'That page doesn''t exist' : 'Something went wrong'">Something went wrong</h1>
    <p class="lead" th:text="${status == 404} ? 'Check the address, or go back to the dashboard.' : 'The request couldn''t be completed. Try again from the dashboard.'">Try again.</p>
    <a th:href="@{/}" class="btn btn-primary">Go to dashboard</a>
</main>
</body>
</html>
