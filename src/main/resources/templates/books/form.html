
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${bookForm.bookId == 0} ? 'Add New Book' : 'Edit Book')}"></head>

<body>
<div class="app">

    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main">

        <nav class="crumbs" aria-label="Breadcrumb">
            <a th:href="@{/modules/books}">Book Management</a>
            <span aria-hidden="true">/</span>
            <span th:text="${bookForm.bookId == 0} ? 'Add New Book' : 'Edit Book'">
                Add New Book
            </span>
        </nav>

        <header class="page-head">
            <div>
                <h1 th:text="${bookForm.bookId == 0} ? 'Add New Book' : 'Edit Book'">
                    Add New Book
                </h1>
                <p class="lead">
                    Enter the book information below to update the catalogue.
                </p>
            </div>
        </header>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <form th:action="@{/modules/books/save}"
              th:object="${bookForm}"
              method="post"
              class="panel form"
              novalidate>

            <input type="hidden" th:field="*{bookId}">

            <fieldset class="form-section">
                <legend>Book Information</legend>

                <div class="grid-2">

                    <div class="field">
                        <label for="isbn">ISBN</label>
                        <input type="text"
                               id="isbn"
                               th:field="*{isbn}"
                               th:errorclass="has-error"
                               placeholder="Enter ISBN">
                        <p class="field-error"
                           th:if="${#fields.hasErrors('isbn')}"
                           th:errors="*{isbn}">Error</p>
                    </div>

                    <div class="field">
                        <label for="title">Book Title</label>
                        <input type="text"
                               id="title"
                               th:field="*{title}"
                               th:errorclass="has-error"
                               placeholder="Enter book title">
                        <p class="field-error"
                           th:if="${#fields.hasErrors('title')}"
                           th:errors="*{title}">Error</p>
                    </div>

                    <div class="field">
                        <label for="author">Author</label>
                        <input type="text"
                               id="author"
                               th:field="*{author}"
                               th:errorclass="has-error"
                               placeholder="Enter author name">
                        <p class="field-error"
                           th:if="${#fields.hasErrors('author')}"
                           th:errors="*{author}">Error</p>
                    </div>

                    <div class="field">
                        <label for="category">Category</label>
                        <input type="text"
                               id="category"
                               th:field="*{category}"
                               th:errorclass="has-error"
                               placeholder="e.g. Fiction, Science">
                        <p class="field-error"
                           th:if="${#fields.hasErrors('category')}"
                           th:errors="*{category}">Error</p>
                    </div>

                    <div class="field">
                        <label for="publisher">Publisher</label>
                        <input type="text"
                               id="publisher"
                               th:field="*{publisher}"
                               th:errorclass="has-error"
                               placeholder="Enter publisher">
                        <p class="field-error"
                           th:if="${#fields.hasErrors('publisher')}"
                           th:errors="*{publisher}">Error</p>
                    </div>

                </div>
            </fieldset>

            <fieldset class="form-section">
                <legend>Pricing and Publication</legend>

                <div class="grid-2">

                    <div class="field">
                        <label for="price">Price (Rs.)</label>
                        <input type="number"
                               id="price"
                               step="0.01"
                               min="0.01"
                               th:field="*{price}"
                               th:errorclass="has-error"
                               placeholder="Enter price">
                        <p class="field-error"
                           th:if="${#fields.hasErrors('price')}"
                           th:errors="*{price}">Error</p>
                    </div>

                    <div class="field">
                        <label for="publishedDate">Published Date</label>
                        <input type="date"
                               id="publishedDate"
                               th:field="*{publishedDate}">
                    </div>

                </div>
            </fieldset>

            <div class="form-actions">
                <button type="submit"
                        class="btn btn-primary"
                        th:text="${bookForm.bookId == 0} ? 'Add Book' : 'Save Changes'">
                    Save Book
                </button>

                <a th:href="@{/modules/books}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>

    </main>
</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
