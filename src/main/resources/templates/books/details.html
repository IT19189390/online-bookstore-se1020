
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Book Details')}"></head>

<body>
<div class="app">

    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main">

        <nav class="crumbs" aria-label="Breadcrumb">
            <a th:href="@{/modules/books}">Book Management</a>
            <span aria-hidden="true">/</span>
            <span th:text="${book.bookId}">1</span>
        </nav>

        <header class="page-head">
            <div>
                <h1 th:text="${book.title}">Book Title</h1>
                <p class="lead">
                    <span th:text="${book.author}">Author</span>
                    · ISBN <span th:text="${book.isbn}">ISBN</span>
                </p>
            </div>

            <div class="head-actions">
                <a th:href="@{/modules/books/edit/{id}(id=${book.bookId})}"
                   class="btn btn-secondary">
                    Edit Book
                </a>

                <form th:action="@{/modules/books/delete/{id}(id=${book.bookId})}"
                      method="post"
                      class="inline-form"
                      data-confirm="Delete this book? This can't be undone.">
                    <button type="submit" class="btn btn-danger">
                        Delete
                    </button>
                </form>
            </div>
        </header>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <section class="panel">

            <h2>Book Information</h2>

            <dl class="details">

                <div>
                    <dt>Book ID</dt>
                    <dd class="mono" th:text="${book.bookId}">1</dd>
                </div>

                <div>
                    <dt>ISBN</dt>
                    <dd th:text="${book.isbn}">ISBN</dd>
                </div>

                <div>
                    <dt>Title</dt>
                    <dd th:text="${book.title}">Title</dd>
                </div>

                <div>
                    <dt>Author</dt>
                    <dd th:text="${book.author}">Author</dd>
                </div>

                <div>
                    <dt>Category</dt>
                    <dd th:text="${book.category}">Category</dd>
                </div>

                <div>
                    <dt>Publisher</dt>
                    <dd th:text="${book.publisher}">Publisher</dd>
                </div>

                <div>
                    <dt>Price</dt>
                    <dd th:text="'Rs. ' + ${#numbers.formatDecimal(book.price, 1, 'COMMA', 2, 'POINT')}">
                        Rs. 0.00
                    </dd>
                </div>

                <div>
                    <dt>Published Date</dt>
                    <dd th:text="${book.publishedDate != null ? #temporals.format(book.publishedDate, 'd MMMM yyyy') : 'Not available'}">
                        Not available
                    </dd>
                </div>

            </dl>

            <div class="form-actions">
                <a th:href="@{/modules/books}" class="btn btn-secondary">
                    Back to Books
                </a>
            </div>

        </section>

    </main>
</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
